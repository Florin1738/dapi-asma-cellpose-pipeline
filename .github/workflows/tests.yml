name: Tests

on:
  push:
  pull_request:

jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Install package
        run: python -m pip install -e .

      - name: Run lightweight checks
        run: |
          python -m pytest \
            tests/test_scientific_contract_terminology.py \
            tests/test_make_release.py \
            tests/test_setup_launchers.py \
            tests/test_gui_launchers.py \
            tests/test_windows_launcher.py \
            tests/test_pipeline_env.py \
            -q
