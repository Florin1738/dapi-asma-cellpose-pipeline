[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dapi-target-normalization"
version = "0.1.0"
description = "DAPI-positive nuclei counting and target-channel intensity per DAPI-positive nucleus for fluorescence microscopy."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Florin Selaru" }
]
dependencies = [
  "imageio>=2.34",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10.2",
  "pyyaml>=6.0",
  "rich>=13.7",
  "scikit-image>=0.23",
  "scipy>=1.12",
  "tifffile>=2024.2",
  "typer>=0.12",
]

[project.optional-dependencies]
cellpose = [
  "cellpose>=4",
]
bioformats = [
  "aicsimageio>=4.14",
]
stardist = [
  "stardist>=0.9",
]
propagation = [
  "centrosome>=1.3",
]
dev = [
  "centrosome>=1.3",
  "pytest>=8.2",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dapi_norm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
